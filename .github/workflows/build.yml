name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generer le projet Android
        run: |
          flutter create --platforms=android --project-name sage_app --org com.sage /tmp/gen
          cp -r /tmp/gen/android ./android
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application android:usesCleartextTraffic="true"#' $M
          sed -i 's#android:label="[^"]*"#android:label="sage"#' $M
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do cp assets/icon.png android/app/src/main/res/mipmap-$d/ic_launcher.png; done
      - run: flutter pub get
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk sage.apk
      - uses: actions/upload-artifact@v4
        with:
          name: sage-apk
          path: sage.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: sage (dernière version)
          files: sage.apk
